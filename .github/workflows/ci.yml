name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Unpack email data
        run: uv run python data/download.py

      - name: Smoke test (import package)
        run: uv run python -c "from cs329z_hw1 import adapters; print('ok')"

      # Uncomment when deterministic tests pass:
      # - name: Deterministic tests
      #   run: uv run pytest
